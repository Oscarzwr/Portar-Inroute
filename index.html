<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal Inroute</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #1f2933;
    }

    header {
      background: #123c2c;
      color: white;
      padding: 25px 35px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 5px 0 0;
    }

    main {
      padding: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    button {
      background: #123c2c;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Portal Inroute</h1>
    <p>Portal interno de gestión</p>
  </header>

  <main>

    <div class="card">

      <h2>Bienvenido</h2>

      <p>
        Esta será nuestra plataforma interna de Inroute.
      </p>

      <button>
        Casos Webfleet
      </button>

    </div>

  </main>

</body>
</html>
